name: Validar catálogo maestro
on:
  pull_request:
    paths:
      - catalogo.json
      - scripts/catalogo.py
      - .github/workflows/catalogo.yml
  push:
    branches: [main]
    paths:
      - catalogo.json
      - scripts/catalogo.py
      - .github/workflows/catalogo.yml
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validar catálogo y SKUs
        run: python3 scripts/catalogo.py --check
